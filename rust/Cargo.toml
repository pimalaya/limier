# limier JNI bridge: a cdylib turning io-imap's sans-io coroutines into
# listMailboxes + streaming searchMailboxes entry points for the Android :client
# module. Scoped to the client; the :app module never depends on it.

[package]
name = "limier"
description = "JNI bridge driving io-imap coroutines for the Limier Android client"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
io-imap = { version = "0.1", default-features = false }
jni = "0.22"
mail-parser = "0.11"
rfc2047-decoder = "1"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
