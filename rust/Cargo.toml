# limier JNI bridge: a cdylib turning io-imap's sans-io coroutines into
# listMailboxes + streaming searchMailboxes entry points for the Android
# :client module. Scoped to the client; the :app module never depends on it.

[package]
name = "limier"
description = "JNI bridge driving io-imap coroutines for the limier Android client"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No client/TLS/scram features: TLS + TCP are owned by Kotlin's
# SSLSocket, so the .so stays a pure no_std protocol state machine.
io-imap = { version = "0.1", default-features = false }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses the ENVELOPE Date header to an epoch the UI formats locally.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# Decodes RFC 2047 encoded-words in the ENVELOPE Subject header.
rfc2047-decoder = "1"
# Parses a fetched raw message into MIME parts for the detail panel.
mail-parser = "0.11"
# Encodes binary/image parts for transport through the JSON reply.
base64 = "0.22"
